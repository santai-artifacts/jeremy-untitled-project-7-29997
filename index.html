<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wordle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0f1512;
    --panel: #16201a;
    --panel-2: #1e2b23;
    --border: #2b3a30;
    --border-lit: #3d5244;
    --correct: #22c55e;
    --correct-dim: #16a34a;
    --present: #eab308;
    --absent: #3a4a40;
    --text: #e9f1ec;
    --muted: #8ba394;
    --shadow: 0 20px 60px -20px rgba(0,0,0,.7);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1100px 600px at 15% -10%, #17241c 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 110%, #14201a 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  header {
    width: 100%;
    max-width: 500px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .logo {
    width: 38px; height: 38px; border-radius: 11px;
    background: linear-gradient(145deg, var(--correct), var(--correct-dim));
    display: grid; place-items: center; font-weight: 700; color: #062011;
    font-size: 1.25rem; box-shadow: 0 8px 20px -6px rgba(34,197,94,.5);
  }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
  .brand p { color: var(--muted); font-size: .74rem; margin-top: 1px; }
  .tools { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--panel); border: 1px solid var(--border);
    color: var(--muted); width: 38px; height: 38px; border-radius: 10px;
    cursor: pointer; display: grid; place-items: center;
    transition: all .15s ease; font-size: 1.1rem;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-lit); background: var(--panel-2); }

  main {
    flex: 1; width: 100%; max-width: 500px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: space-between; gap: 14px; padding: 18px;
  }

  .board {
    display: grid; grid-template-rows: repeat(6, 1fr); gap: 7px;
    margin: auto 0;
  }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .tile {
    width: 60px; height: 60px;
    display: grid; place-items: center;
    font-size: 1.9rem; font-weight: 700; text-transform: uppercase;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: transparent;
    transition: transform .1s ease, border-color .15s ease, background .2s ease;
    user-select: none;
  }
  .tile.filled { border-color: var(--border-lit); animation: pop .1s ease; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }

  .tile.reveal { animation: flip .5s ease forwards; }
  @keyframes flip {
    0% { transform: rotateX(0); }
    50% { transform: rotateX(90deg); }
    100% { transform: rotateX(0); }
  }
  .tile.correct { background: var(--correct); border-color: var(--correct); color: #06210f; }
  .tile.present { background: var(--present); border-color: var(--present); color: #241c00; }
  .tile.absent  { background: var(--absent);  border-color: var(--absent);  color: #cdd8d1; }

  .row.shake { animation: shake .4s ease; }
  @keyframes shake {
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
    40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)}
  }
  .row.win .tile.correct { animation: bounce .5s ease; }
  .row.win .tile.correct:nth-child(2){animation-delay:.08s}
  .row.win .tile.correct:nth-child(3){animation-delay:.16s}
  .row.win .tile.correct:nth-child(4){animation-delay:.24s}
  .row.win .tile.correct:nth-child(5){animation-delay:.32s}
  @keyframes bounce { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-14px)} 70%{transform:translateY(4px)} }

  .keyboard { display: flex; flex-direction: column; gap: 7px; width: 100%; max-width: 484px; }
  .krow { display: flex; gap: 6px; justify-content: center; }
  .key {
    flex: 1; min-width: 0; height: 54px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 7px; font-family: inherit;
    font-size: .95rem; font-weight: 600; text-transform: uppercase;
    cursor: pointer; transition: all .12s ease;
    display: grid; place-items: center;
  }
  .key.wide { flex: 1.5; font-size: .72rem; }
  .key:hover { background: var(--border); }
  .key:active { transform: scale(.95); }
  .key.correct { background: var(--correct); border-color: var(--correct); color: #06210f; }
  .key.present { background: var(--present); border-color: var(--present); color: #241c00; }
  .key.absent  { background: #24302a; border-color: #24302a; color: #6b7d72; }

  .toast-wrap {
    position: fixed; top: 76px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    z-index: 50; pointer-events: none;
  }
  .toast {
    background: #eef4f0; color: #0f1512; font-weight: 600; font-size: .9rem;
    padding: 11px 18px; border-radius: 10px; box-shadow: 0 10px 30px -8px rgba(0,0,0,.6);
    animation: toastIn .2s ease;
  }
  @keyframes toastIn { from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:translateY(0)} }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(6,10,8,.72);
    backdrop-filter: blur(6px); display: grid; place-items: center;
    z-index: 100; padding: 20px; transition: opacity .2s ease;
  }
  .modal-bg.hidden { opacity: 0; pointer-events: none; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 18px; padding: 26px; max-width: 360px; width: 100%;
    box-shadow: var(--shadow); text-align: center;
  }
  .modal h2 { font-size: 1.5rem; margin-bottom: 6px; letter-spacing: -.02em; }
  .modal .sub { color: var(--muted); font-size: .9rem; margin-bottom: 18px; line-height: 1.5; }
  .answer-reveal {
    font-size: 2rem; font-weight: 700; letter-spacing: .22em;
    text-transform: uppercase; color: var(--correct); margin: 4px 0 18px;
  }
  .stats { display: flex; justify-content: center; gap: 22px; margin-bottom: 20px; }
  .stat .n { font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-top: 2px; }
  .modal .how { text-align: left; color: var(--muted); font-size: .85rem; line-height: 1.6; margin-bottom: 18px; }
  .modal .how b { color: var(--text); }
  .chip { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; font-weight: 700; color: #06210f; vertical-align: middle; font-size: .8rem; }
  button.primary {
    background: linear-gradient(145deg, var(--correct), var(--correct-dim));
    color: #06210f; border: none; border-radius: 11px; padding: 13px 24px;
    font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer;
    width: 100%; box-shadow: 0 10px 24px -8px rgba(34,197,94,.5);
    transition: transform .12s ease;
  }
  button.primary:hover { transform: translateY(-2px); }

  @media (max-width: 460px) {
    .tile { width: 52px; height: 52px; font-size: 1.6rem; }
    .key { height: 48px; }
    h1 { font-size: 1.3rem; }
  }
  @media (max-width: 360px) {
    .tile { width: 46px; height: 46px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">W</div>
      <div>
        <h1>Wordle</h1>
        <p>Guess the word in six tries.</p>
      </div>
    </div>
    <div class="tools">
      <button class="icon-btn" id="helpBtn" title="How to play" aria-label="How to play">?</button>
      <button class="icon-btn" id="newBtn" title="New game" aria-label="New game">↻</button>
    </div>
  </header>

  <main>
    <div class="board" id="board"></div>
    <div class="keyboard" id="keyboard"></div>
  </main>

  <div class="toast-wrap" id="toasts"></div>

  <div class="modal-bg hidden" id="modalBg">
    <div class="modal" id="modal"></div>
  </div>

  const VALID = new Set([...ANSWERS, ...EXTRA]);

  const ROWS = 6, COLS = 5;
  const boardEl = document.getElementById("board");
  const kbEl = document.getElementById("keyboard");
  const toastEl = document.getElementById("toasts");
  const modalBg = document.getElementById("modalBg");
  const modal = document.getElementById("modal");

  let answer, row, col, grid, over, busy;
  let stats = { played: 0, wins: 0, streak: 0, maxStreak: 0 };

  function pickAnswer() {
    return ANSWERS[Math.floor(Math.random() * ANSWERS.length)].toUpperCase();
  }

  function buildBoard() {
    boardEl.innerHTML = "";
    for (let r = 0; r < ROWS; r++) {
      const rowEl = document.createElement("div");
      rowEl.className = "row";
      rowEl.dataset.row = r;
      for (let c = 0; c < COLS; c++) {
        const t = document.createElement("div");
        t.className = "tile";
        t.dataset.row = r; t.dataset.col = c;
        rowEl.appendChild(t);
      }
      boardEl.appendChild(rowEl);
    }
  }

  const KEYS = [
    "Q W E R T Y U I O P".split(" "),
    "A S D F G H J K L".split(" "),
    ["Enter", ..."Z X C V B N M".split(" "), "Back"]
  ];

  function buildKeyboard() {
    kbEl.innerHTML = "";
    KEYS.forEach(krow => {
      const rEl = document.createElement("div");
      rEl.className = "krow";
      krow.forEach(k => {
        const b = document.createElement("button");
        b.className = "key" + (k.length > 1 ? " wide" : "");
        b.textContent = k === "Back" ? "⌫" : k;
        b.dataset.key = k;
        b.addEventListener("click", () => handleKey(k));
        rEl.appendChild(b);
      });
      kbEl.appendChild(rEl);
    });
  }

  function tileAt(r, c) { return boardEl.querySelector(`.tile[data-row="${r}"][data-col="${c}"]`); }
  function keyEl(k) { return kbEl.querySelector(`.key[data-key="${k}"]`); }

  function toast(msg, ms = 1400) {
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    toastEl.appendChild(t);
    setTimeout(() => {
      t.style.transition = "opacity .3s"; t.style.opacity = "0";
      setTimeout(() => t.remove(), 300);
    }, ms);
  }

  function newGame() {
    answer = pickAnswer();
    row = 0; col = 0; over = false; busy = false;
    grid = Array.from({length: ROWS}, () => Array(COLS).fill(""));
    buildBoard();
    // reset keyboard colors
    kbEl.querySelectorAll(".key").forEach(k => k.classList.remove("correct","present","absent"));
    closeModal();
  }

  function handleKey(k) {
    if (over || busy) return;
    if (k === "Enter") return submit();
    if (k === "Back") return backspace();
    if (/^[a-zA-Z]$/.test(k) && col < COLS) {
      grid[row][col] = k.toUpperCase();
      const t = tileAt(row, col);
      t.textContent = k; t.classList.add("filled");
      col++;
    }
  }

  function backspace() {
    if (col > 0) {
      col--;
      grid[row][col] = "";
      const t = tileAt(row, col);
      t.textContent = ""; t.classList.remove("filled");
    }
  }

  function shakeRow() {
    const rEl = boardEl.querySelector(`.row[data-row="${row}"]`);
    rEl.classList.add("shake");
    setTimeout(() => rEl.classList.remove("shake"), 420);
  }

  function submit() {
    if (col < COLS) { toast("Not enough letters"); shakeRow(); return; }
    const guess = grid[row].join("");
    if (!VALID.has(guess.toLowerCase())) { toast("Not in word list"); shakeRow(); return; }

    // Score with correct duplicate handling
    const result = Array(COLS).fill("absent");
    const ans = answer.split("");
    const counts = {};
    ans.forEach(ch => counts[ch] = (counts[ch]||0)+1);
    // first pass: correct
    for (let c = 0; c < COLS; c++) {
      if (guess[c] === ans[c]) { result[c] = "correct"; counts[guess[c]]--; }
    }
    // second pass: present
    for (let c = 0; c < COLS; c++) {
      if (result[c] === "correct") continue;
      if (counts[guess[c]] > 0) { result[c] = "present"; counts[guess[c]]--; }
    }

    busy = true;
    const won = result.every(r => r === "correct");

    for (let c = 0; c < COLS; c++) {
      const t = tileAt(row, c);
      setTimeout(() => {
        t.classList.add("reveal");
        setTimeout(() => {
          t.classList.add(result[c]);
          // update keyboard (don't downgrade a correct key)
          const ke = keyEl(guess[c]);
          if (ke) {
            const cur = ke.classList.contains("correct") ? "correct"
                      : ke.classList.contains("present") ? "present"
                      : ke.classList.contains("absent") ? "absent" : "";
            const rank = { "": 0, absent: 1, present: 2, correct: 3 };
            if (rank[result[c]] > rank[cur]) {
              ke.classList.remove("present","absent");
              ke.classList.add(result[c]);
            }
          }
        }, 250);
      }, c * 260);
    }

    const revealDone = (COLS - 1) * 260 + 500;
    setTimeout(() => {
      busy = false;
      if (won) {
        const rEl = boardEl.querySelector(`.row[data-row="${row}"]`);
        rEl.classList.add("win");
        over = true;
        recordResult(true);
        setTimeout(() => showEndModal(true), 700);
      } else if (row === ROWS - 1) {
        over = true;
        recordResult(false);
        setTimeout(() => showEndModal(false), 400);
      } else {
        row++; col = 0;
      }
    }, revealDone);
  }

  function recordResult(won) {
    stats.played++;
    if (won) { stats.wins++; stats.streak++; stats.maxStreak = Math.max(stats.maxStreak, stats.streak); }
    else { stats.streak = 0; }
  }

  // ---- Modals ----
  function closeModal() { modalBg.classList.add("hidden"); }

  function showEndModal(won) {
    const winPct = stats.played ? Math.round((stats.wins / stats.played) * 100) : 0;
    modal.innerHTML = `
      <h2>${won ? "Splendid! 🎉" : "So close!"}</h2>
      <p class="sub">${won ? `You got it in ${row + 1} ${row === 0 ? "try" : "tries"}.` : "Better luck next round."}</p>
      <div class="answer-reveal">${answer}</div>
      <div class="stats">
        <div class="stat"><div class="n">${stats.played}</div><div class="l">Played</div></div>
        <div class="stat"><div class="n">${winPct}</div><div class="l">Win %</div></div>
        <div class="stat"><div class="n">${stats.streak}</div><div class="l">Streak</div></div>
        <div class="stat"><div class="n">${stats.maxStreak}</div><div class="l">Best</div></div>
      </div>
      <button class="primary" id="againBtn">Play Again</button>
    `;
    modalBg.classList.remove("hidden");
    document.getElementById("againBtn").addEventListener("click", newGame);
  }

  function showHelp() {
    modal.innerHTML = `
      <h2>How to play</h2>
      <p class="sub">Guess the hidden 5-letter word in six tries.</p>
      <div class="how">
        Each guess must be a valid word. After each guess, the tiles change color:
        <p style="margin-top:10px"><span class="chip" style="background:var(--correct)">A</span> &nbsp;<b>Green</b> — right letter, right spot.</p>
        <p style="margin-top:8px"><span class="chip" style="background:var(--present)">B</span> &nbsp;<b>Yellow</b> — in the word, wrong spot.</p>
        <p style="margin-top:8px"><span class="chip" style="background:var(--absent);color:#cdd8d1">C</span> &nbsp;<b>Gray</b> — not in the word.</p>
      </div>
      <button class="primary" id="closeHelp">Got it</button>
    `;
    modalBg.classList.remove("hidden");
    document.getElementById("closeHelp").addEventListener("click", closeModal);
  }

  // ---- Events ----
  document.addEventListener("keydown", (e) => {
    if (!modalBg.classList.contains("hidden")) {
      if (e.key === "Enter") { const b = modal.querySelector(".primary"); if (b) b.click(); }
      return;
    }
    if (e.key === "Enter") handleKey("Enter");
    else if (e.key === "Backspace") handleKey("Back");
    else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key);
  });

  document.getElementById("newBtn").addEventListener("click", newGame);
  document.getElementById("helpBtn").addEventListener("click", showHelp);
  modalBg.addEventListener("click", (e) => { if (e.target === modalBg) closeModal(); });

  // Init
  buildKeyboard();
  newGame();
})();
</script>
</body>
</html>
